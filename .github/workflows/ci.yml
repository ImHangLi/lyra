name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, build, contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Contract (schemas and fixtures)
        run: scripts/check-contract.sh
      - name: Smoke (validate the test workspace and run a task)
        env:
          MIRA_DATA_HOME: ${{ runner.temp }}/mira-data
          MIRA_RUNTIME_DIR: /tmp/mira-ci
        run: |
          target/debug/mira validate tests/fixtures/workspace/.mira --json
          cd tests/fixtures/workspace
          ../../../target/debug/mira run dev.check --json
          ../../../target/debug/mira run markers.scan --json
          ../../../target/debug/mira view markers.table --json > /dev/null
          ../../../target/debug/mira down --wait --json
