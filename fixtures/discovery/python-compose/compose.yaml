services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://fixture:fixture@db:5432/fixture
    depends_on:
      - db
  db:
    image: postgres:16
    ports:
      - target: 5432
        published: 5433
    profiles:
      - local
