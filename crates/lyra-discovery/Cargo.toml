[package]
name = "lyra-discovery"
description = "Bounded, read-only static discovery of project facts"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
lyra-protocol = { version = "0.1.0", path = "../lyra-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
yaml-rust2 = { version = "0.13.0", default-features = false }

[lints]
workspace = true
