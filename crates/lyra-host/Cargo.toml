[package]
name = "lyra-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.13.0"
lyra-protocol = { version = "0.1.0", path = "../lyra-protocol" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process", "signal", "fs"] }

[lints]
workspace = true
