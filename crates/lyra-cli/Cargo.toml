[package]
name = "lyra-cli"
description = "The lyra command-line entry point"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lyra"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
lyra-protocol = { version = "0.1.0", path = "../lyra-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints]
workspace = true
